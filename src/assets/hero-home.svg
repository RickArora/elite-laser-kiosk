<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg" fill="none">
  <defs>
    <radialGradient id="hh-glow1" cx="60%" cy="40%" r="40%">
      <stop offset="0%" stop-color="#3B9EDB" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#3B9EDB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hh-glow2" cx="75%" cy="60%" r="30%">
      <stop offset="0%" stop-color="#3B9EDB" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#3B9EDB" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background glows -->
  <ellipse cx="540" cy="240" rx="260" ry="220" fill="url(#hh-glow1)"/>
  <ellipse cx="675" cy="360" rx="180" ry="140" fill="url(#hh-glow2)"/>

  <!-- Central laser emitter geometry -->
  <!-- Outer ring -->
  <circle cx="580" cy="290" r="160" stroke="#3B9EDB" stroke-width="0.6" opacity="0.12"/>
  <circle cx="580" cy="290" r="135" stroke="#3B9EDB" stroke-width="0.8" opacity="0.16"/>
  <circle cx="580" cy="290" r="110" stroke="#3B9EDB" stroke-width="1.0" opacity="0.20"/>
  <circle cx="580" cy="290" r="85"  stroke="#3B9EDB" stroke-width="1.2" opacity="0.26"/>
  <circle cx="580" cy="290" r="60"  stroke="#3B9EDB" stroke-width="1.6" opacity="0.32"/>
  <circle cx="580" cy="290" r="35"  stroke="#3B9EDB" stroke-width="2.0" opacity="0.50"/>

  <!-- Core emitter dot -->
  <circle cx="580" cy="290" r="6" fill="#3B9EDB" opacity="0.80"/>
  <circle cx="580" cy="290" r="10" stroke="#3B9EDB" stroke-width="1.5" opacity="0.55"/>

  <!-- Laser beams radiating outward -->
  <!-- Top beam -->
  <line x1="580" y1="280" x2="580" y2="120" stroke="#3B9EDB" stroke-width="1.5" opacity="0.45" stroke-linecap="round"/>
  <line x1="578" y1="275" x2="574" y2="130" stroke="#6EC6FF" stroke-width="0.6" opacity="0.25" stroke-linecap="round"/>

  <!-- Bottom beam -->
  <line x1="580" y1="300" x2="580" y2="470" stroke="#3B9EDB" stroke-width="1.5" opacity="0.45" stroke-linecap="round"/>
  <line x1="582" y1="305" x2="586" y2="465" stroke="#6EC6FF" stroke-width="0.6" opacity="0.25" stroke-linecap="round"/>

  <!-- Left beam -->
  <line x1="570" y1="290" x2="400" y2="290" stroke="#3B9EDB" stroke-width="1.5" opacity="0.35" stroke-linecap="round"/>

  <!-- Right beam -->
  <line x1="590" y1="290" x2="760" y2="290" stroke="#3B9EDB" stroke-width="1.5" opacity="0.35" stroke-linecap="round"/>

  <!-- Diagonal beams -->
  <line x1="569" y1="281" x2="460" y2="172" stroke="#3B9EDB" stroke-width="1.2" opacity="0.30"/>
  <line x1="591" y1="281" x2="700" y2="172" stroke="#3B9EDB" stroke-width="1.2" opacity="0.30"/>
  <line x1="569" y1="299" x2="460" y2="408" stroke="#3B9EDB" stroke-width="1.2" opacity="0.30"/>
  <line x1="591" y1="299" x2="700" y2="408" stroke="#3B9EDB" stroke-width="1.2" opacity="0.30"/>

