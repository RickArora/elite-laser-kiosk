  <circle cx="720" cy="200" r="2.5" fill="#3B9EDB" opacity="0.50"/>
  <circle cx="445" cy="395" r="2" fill="#3B9EDB" opacity="0.40"/>
  <circle cx="760" cy="370" r="2" fill="#6EC6FF" opacity="0.45"/>

  <!-- EL monogram — faint watermark -->
  <text x="560" y="306" font-family="Georgia, serif" font-size="18" fill="#3B9EDB" opacity="0.18" text-anchor="middle" letter-spacing="4">EL</text>
