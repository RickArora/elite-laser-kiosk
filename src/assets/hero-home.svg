  <rect x="390" y="450" width="380" height="8"  rx="4" fill="#3B9EDB" opacity="0.08"/>
  <rect x="370" y="465" width="420" height="6"  rx="3" fill="#3B9EDB" opacity="0.06"/>
  <rect x="350" y="477" width="460" height="5"  rx="2.5" fill="#3B9EDB" opacity="0.04"/>

