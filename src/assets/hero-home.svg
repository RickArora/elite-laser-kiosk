  <line x1="350" y1="250" x2="800" y2="250" stroke="#3B9EDB" stroke-width="0.4" opacity="0.08"/>
  <line x1="350" y1="350" x2="800" y2="350" stroke="#3B9EDB" stroke-width="0.4" opacity="0.08"/>
  <line x1="350" y1="400" x2="800" y2="400" stroke="#3B9EDB" stroke-width="0.4" opacity="0.08"/>

  <line x1="420" y1="100" x2="420" y2="500" stroke="#3B9EDB" stroke-width="0.4" opacity="0.08"/>
  <line x1="500" y1="100" x2="500" y2="500" stroke="#3B9EDB" stroke-width="0.4" opacity="0.08"/>
  <line x1="660" y1="100" x2="660" y2="500" stroke="#3B9EDB" stroke-width="0.4" opacity="0.08"/>
  <line x1="740" y1="100" x2="740" y2="500" stroke="#3B9EDB" stroke-width="0.4" opacity="0.08"/>

  <!-- Sparkle accents -->
  <path d="M 760 160 L 762 153 L 764 160 L 771 162 L 764 164 L 762 171 L 760 164 L 753 162 Z"
