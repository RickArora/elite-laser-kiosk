  <line x1="560" y1="430" x2="560" y2="454" stroke="#3B9EDB" stroke-width="1.2" opacity="0.65"/>
  <line x1="600" y1="435" x2="600" y2="454" stroke="#6EC6FF" stroke-width="1.0" opacity="0.50"/>
  <line x1="640" y1="440" x2="640" y2="454" stroke="#6EC6FF" stroke-width="1.0" opacity="0.50"/>
  <line x1="680" y1="445" x2="680" y2="454" stroke="#6EC6FF" stroke-width="0.8" opacity="0.40"/>

