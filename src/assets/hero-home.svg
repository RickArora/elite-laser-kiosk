  <circle cx="560" cy="454" r="4" stroke="#3B9EDB" stroke-width="1.2" opacity="0.45"/>
  <circle cx="600" cy="454" r="4" stroke="#3B9EDB" stroke-width="1.2" opacity="0.45"/>
