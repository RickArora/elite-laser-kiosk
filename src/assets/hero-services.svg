<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg" fill="none">
  <defs>
    <radialGradient id="sv-g1" cx="25%" cy="50%" r="35%">
      <stop offset="0%" stop-color="#3B9EDB" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#3B9EDB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sv-g2" cx="75%" cy="50%" r="35%">
      <stop offset="0%" stop-color="#3B9EDB" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#3B9EDB" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="225" cy="250" rx="200" ry="180" fill="url(#sv-g1)"/>
  <ellipse cx="675" cy="250" rx="200" ry="180" fill="url(#sv-g2)"/>

  <!-- Divider -->
  <line x1="450" y1="60" x2="450" y2="440" stroke="#3B9EDB" stroke-width="0.6" opacity="0.20"/>

  <!-- ── LEFT PANEL: FACE ── -->
  <!-- Face oval -->
  <ellipse cx="225" cy="220" rx="65" ry="85" stroke="#3B9EDB" stroke-width="1.8" opacity="0.55"/>
  <!-- Brows -->
  <path d="M 182 186 C 192 178 204 177 214 181" stroke="#3B9EDB" stroke-width="2.0" stroke-linecap="round" opacity="0.65"/>
  <path d="M 236 181 C 246 177 258 178 268 186" stroke="#3B9EDB" stroke-width="2.0" stroke-linecap="round" opacity="0.65"/>
  <!-- Eyes -->
  <path d="M 182 200 C 196 192 210 192 214 200" stroke="#3B9EDB" stroke-width="1.5" stroke-linecap="round" opacity="0.55"/>
  <path d="M 236 200 C 240 192 254 192 268 200" stroke="#3B9EDB" stroke-width="1.5" stroke-linecap="round" opacity="0.55"/>
  <!-- Upper lip treatment dots -->
  <circle cx="218" cy="248" r="3.5" stroke="#3B9EDB" stroke-width="1.1" opacity="0.55"/>
  <circle cx="225" cy="246" r="3.5" stroke="#3B9EDB" stroke-width="1.1" opacity="0.55"/>
  <circle cx="232" cy="248" r="3.5" stroke="#3B9EDB" stroke-width="1.1" opacity="0.55"/>
  <!-- Laser pulses to upper lip -->
  <line x1="218" y1="228" x2="218" y2="245" stroke="#6EC6FF" stroke-width="1.0" opacity="0.45" stroke-dasharray="2,2"/>
  <line x1="225" y1="224" x2="225" y2="243" stroke="#3B9EDB" stroke-width="1.2" opacity="0.55" stroke-dasharray="2,2"/>
  <line x1="232" y1="228" x2="232" y2="245" stroke="#6EC6FF" stroke-width="1.0" opacity="0.45" stroke-dasharray="2,2"/>
  <!-- Concentric rings around face -->
  <ellipse cx="225" cy="220" rx="88" ry="108" stroke="#3B9EDB" stroke-width="0.6" opacity="0.14"/>
  <ellipse cx="225" cy="220" rx="110" ry="132" stroke="#3B9EDB" stroke-width="0.5" opacity="0.10"/>
  <!-- Label line -->
  <line x1="80" y1="360" x2="370" y2="360" stroke="#3B9EDB" stroke-width="0.6" opacity="0.20"/>
  <!-- Sparkle -->
  <path d="M 358 130 L 360 124 L 362 130 L 368 132 L 362 134 L 360 140 L 358 134 L 352 132 Z"
        fill="#3B9EDB" opacity="0.50"/>
  <circle cx="90" cy="160" r="2" fill="#6EC6FF" opacity="0.45"/>

  <!-- ── RIGHT PANEL: BODY ── -->
  <!-- Body silhouette (simplified) -->
  <!-- Head -->
  <ellipse cx="675" cy="140" rx="32" ry="36" stroke="#3B9EDB" stroke-width="1.5" opacity="0.50"/>
  <!-- Torso outline -->
  <path d="M 648 175 C 635 190 628 220 630 255"
        stroke="#3B9EDB" stroke-width="1.4" stroke-linecap="round" opacity="0.45"/>
  <path d="M 702 175 C 715 190 722 220 720 255"
        stroke="#3B9EDB" stroke-width="1.4" stroke-linecap="round" opacity="0.45"/>
  <!-- Waist + hip -->
  <path d="M 630 255 C 634 270 642 280 655 285"
        stroke="#3B9EDB" stroke-width="1.2" stroke-linecap="round" opacity="0.40"/>
  <path d="M 720 255 C 716 270 708 280 695 285"
        stroke="#3B9EDB" stroke-width="1.2" stroke-linecap="round" opacity="0.40"/>
  <!-- Legs -->
  <line x1="655" y1="285" x2="648" y2="420" stroke="#3B9EDB" stroke-width="1.3" opacity="0.40" stroke-linecap="round"/>
  <line x1="695" y1="285" x2="702" y2="420" stroke="#3B9EDB" stroke-width="1.3" opacity="0.40" stroke-linecap="round"/>
  <!-- Arms -->
  <path d="M 635 190 C 618 210 612 240 614 265"
        stroke="#3B9EDB" stroke-width="1.0" stroke-linecap="round" opacity="0.35"/>
  <path d="M 715 190 C 732 210 738 240 736 265"
        stroke="#3B9EDB" stroke-width="1.0" stroke-linecap="round" opacity="0.35"/>

  <!-- Treatment dots on legs -->
  <circle cx="648" cy="335" r="4" stroke="#3B9EDB" stroke-width="1.0" opacity="0.45"/>
  <circle cx="702" cy="335" r="4" stroke="#3B9EDB" stroke-width="1.0" opacity="0.45"/>
  <circle cx="647" cy="370" r="3.5" stroke="#6EC6FF" stroke-width="0.9" opacity="0.38"/>
  <circle cx="703" cy="370" r="3.5" stroke="#6EC6FF" stroke-width="0.9" opacity="0.38"/>
  <circle cx="647" cy="400" r="3" stroke="#6EC6FF" stroke-width="0.8" opacity="0.32"/>
  <circle cx="703" cy="400" r="3" stroke="#6EC6FF" stroke-width="0.8" opacity="0.32"/>

  <!-- Underarm dots -->
  <circle cx="630" cy="200" r="5" stroke="#3B9EDB" stroke-width="1.0" opacity="0.40" stroke-dasharray="2,2"/>
  <circle cx="720" cy="200" r="5" stroke="#3B9EDB" stroke-width="1.0" opacity="0.40" stroke-dasharray="2,2"/>

  <!-- Laser pulses hitting leg dots -->
  <line x1="648" y1="310" x2="648" y2="332" stroke="#3B9EDB" stroke-width="1.0" opacity="0.50" stroke-dasharray="2,2"/>
  <line x1="702" y1="310" x2="702" y2="332" stroke="#3B9EDB" stroke-width="1.0" opacity="0.50" stroke-dasharray="2,2"/>

  <!-- Torso grid lines -->
  <line x1="640" y1="210" x2="710" y2="210" stroke="#3B9EDB" stroke-width="0.5" opacity="0.18"/>
  <line x1="635" y1="235" x2="715" y2="235" stroke="#3B9EDB" stroke-width="0.5" opacity="0.15"/>
  <line x1="634" y1="258" x2="716" y2="258" stroke="#3B9EDB" stroke-width="0.5" opacity="0.12"/>

  <!-- Sparkle -->
  <path d="M 550 155 L 552 148 L 554 155 L 561 157 L 554 159 L 552 166 L 550 159 L 543 157 Z"
        fill="#3B9EDB" opacity="0.50"/>
  <circle cx="800" cy="300" r="2.5" fill="#3B9EDB" opacity="0.40"/>
  <circle cx="530" cy="380" r="2.0" fill="#6EC6FF" opacity="0.38"/>
</svg>
